[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bambu-monitor"
version = "0.1.0"
description = "Standalone local monitoring service for Bambu Lab 3D printers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Gaurav Singh" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "aiosqlite>=0.20.0",
    "sse-starlette>=2.0.0",
    "httpx>=0.27.0",
    "keyring>=24.0.0",
    "cryptography>=42.0.0",
    "paho-mqtt>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
bambu-monitor = "bambu_monitor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

application:
  name: bambu-monitor
  environment: development
  log_level: INFO
  public_base_url: ${BAMBU_MONITOR_PUBLIC_URL:http://localhost:8000}
  api_token: ${BAMBU_MONITOR_API_TOKEN:}

database:
  path: ./data/bambu.db
  journal_mode: WAL
  synchronous: NORMAL
  flush_interval_seconds: 5.0

# Configured printers (or onboard dynamically via 'bambu-monitor onboard')
printers:
  - id: bambu-a1-mini-602482
    model: A1 Mini
    # Real host/serial live in .env (not committed): BAMBU_HOST / BAMBU_SERIAL
    host: ${BAMBU_HOST:}
    serial_number: ${BAMBU_SERIAL:}
    port: 8883
    tls: true
    tls_verify: false
    camera:
      enabled: true
      # Set A1_MINI_CAMERA_RTSP in the environment; credentials must not be committed.
      rtsp_url: ${A1_MINI_CAMERA_RTSP:}
      timeout_seconds: 5.0
      probe_size_bytes: 1048576
      analyze_duration_us: 1000000

events:
  delivery:
    enabled: true
    endpoint: ${EVENT_ENDPOINT:http://localhost:8644/webhooks/bambu-printer}
    secret: ${EVENT_SECRET:}
    timeout_seconds: 10
    retry_attempts: 5
    initial_backoff_seconds: 2.0
    backoff_multiplier: 2.0
    max_backoff_seconds: 300.0

detection:
  stall:
    enabled: true
    min_check_seconds: 300.0
    adaptive_factor: 1.5

# Print timelapse subsystem configuration
timelapse:
  enabled: true
  storage_dir: ./data/timelapses
  camera:
    type: tapo_rtsp
    # Stream selection: 'stream1' (HD 1080p/2K) or 'stream2' (360p sub-stream)
    stream: stream1
    # RTSP URL configured via env var to prevent committing camera credentials:
    # rtsp://<username>:<password>@<camera-ip>:554/stream1
    url: ${TIMELAPSE_CAMERA_RTSP:}
  capture:
    interval_seconds: 5.0
    # Capture mode: 'layer' (on layer change), 'interval' (periodic time), or 'hybrid' (both)
    mode: hybrid
  video:
    fps: 30
    codec: libx264
    quality: 18
    pixel_format: yuv420p
    max_concurrent: 1
  overlay:
    # Set to true to burn telemetry HUD banner into video frames; false preserves clean camera frames
    enabled: false
    show_temperatures: true
    show_progress: true
    show_alerts: true
  retention:
    # 'delete_after_video' cleans up frame images once MP4 renders successfully; 'retain' keeps all JPEGs
    successful_frames: delete_after_video
    # Retain frame images for failed or cancelled prints for post-mortem analysis
    failed_frames: retain
    videos_days: 365


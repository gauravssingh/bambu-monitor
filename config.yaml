application:
  name: bambu-monitor
  environment: development
  log_level: INFO

database:
  path: ./data/bambu.db
  journal_mode: WAL
  synchronous: NORMAL
  flush_interval_seconds: 5.0

# Configured printers (or onboard dynamically via 'bambu-monitor onboard')
printers: []
# - id: bambu-a1-mini
#   model: A1 Mini
#   host: 192.168.68.57
#   serial_number: 0309DA572602482
#   port: 8883
#   tls: true
#   tls_verify: false

events:
  delivery:
    enabled: true
    endpoint: ${EVENT_ENDPOINT:http://localhost:8644/webhooks/bambu-printer}
    secret: ${EVENT_SECRET:bambu-secret-8f92a4e7c10b42d591}
    timeout_seconds: 10
    retry_attempts: 5
    initial_backoff_seconds: 2.0
    backoff_multiplier: 2.0
    max_backoff_seconds: 300.0

detection:
  stall:
    enabled: true
    min_check_seconds: 300.0
    adaptive_factor: 1.5
